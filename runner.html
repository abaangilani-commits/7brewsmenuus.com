<!DOCTYPE html>
<html><head><title>Runner</title></head>
<body>
<h1>GitHub Push Runner</h1>
<pre id="log">Starting...</pre>
<script>
const log = document.getElementById('log');
function addLog(msg) { log.textContent += '\n' + msg; }

// We need GH credentials - they'll be passed via URL hash
const params = new URLSearchParams(window.location.hash.substring(1));
const token = params.get('t');
const owner = params.get('o');  
const repo = params.get('r');

if (!token) {
    addLog('ERROR: No credentials provided in URL hash');
} else {
    addLog('Credentials found. Owner: ' + owner + ', Repo: ' + repo);
}

window.runPush = async function() {
    async function apiCall(endpoint, body) {
        const url = 'https://api.github.com/repos/' + owner + '/' + repo + endpoint;
        const resp = await fetch(url, {
            method: 'POST',
            headers: {
                'Authorization': 'token ' + token,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(body)
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
    }
    
    const blobs = [];
    const errors = [];
    
    for (let batch = 0; batch < 8; batch++) {
        try {
            const resp = await fetch('/upload_batch_' + batch + '.json');
            const files = await resp.json();
            addLog('Batch ' + batch + ': ' + files.length + ' files');
            
            for (let i = 0; i < files.length; i += 5) {
                const chunk = files.slice(i, i + 5);
                await Promise.all(chunk.map(async (f) => {
                    try {
                        const r = await apiCall('/git/blobs', {content: f.b64, encoding: 'base64'});
                        blobs.push({path: f.path, sha: r.sha});
                    } catch(e) {
                        errors.push({path: f.path, error: e.message});
                        addLog('  ERROR: ' + f.path + ': ' + e.message);
                    }
                }));
            }
            addLog('  Batch ' + batch + ' done, total blobs: ' + blobs.length);
        } catch(e) {
            addLog('Batch ' + batch + ' FAILED: ' + e.message);
        }
    }
    
    addLog('\\nAll batches done. Blobs: ' + blobs.length + ', Errors: ' + errors.length);
    
    if (blobs.length > 0) {
        const tree = await apiCall('/git/trees', {
            tree: blobs.map(b => ({path: b.path, mode: '100644', type: 'blob', sha: b.sha}))
        });
        addLog('Tree: ' + tree.sha);
        
        const commit = await apiCall('/git/commits', {
            message: 'Initial commit: 7 Brew Menu US \\u2014 full site with 41 pages\\n\\nDeploy static site with menu pages, location directory, nutrition calculator,\\nand product images for GitHub Pages hosting.',
            tree: tree.sha
        });
        addLog('Commit: ' + commit.sha);
        
        const ref = await apiCall('/git/refs', {ref: 'refs/heads/main', sha: commit.sha});
        addLog('Ref: ' + ref.ref);
        
        window._result = {totalBlobs: blobs.length, tree: tree.sha, commit: commit.sha, ref: ref.ref};
        addLog('\\nSUCCESS: ' + JSON.stringify(window._result));
    }
};
</script>
</body></html>
